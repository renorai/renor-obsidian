name: Release

# Push a tag that matches manifest.json's version (for example 0.1.1) to build the plugin, attest its release assets
# and publish them as a GitHub release.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:standalone
      - name: Tag must match manifest.json
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" main.js manifest.json --title "${GITHUB_REF_NAME}" --generate-notes
